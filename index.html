<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תחזית מזג האוויר</title>
    <style>
        :root {
            --primary-color: #2196F3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button.search-btn {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .nav-btn {
            padding: 10px 20px;
            background-color: #e0e0e0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 900px;
        }

        .page.active {
            display: block;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .weather-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .weather-card:hover {
            transform: translateY(-5px);
        }

        .temp {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .custom-result {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>תחזית מזג אוויר עולמית</h1>
    </header>

    <div class="search-container">
        <input type="text" id="cityInput" placeholder="הקלד שם של עיר באנגלית (למשל: London, Paris)...">
        <button class="search-btn" onclick="searchCity()">חפש</button>
    </div>

    <div id="searchResult" class="page active custom-result" style="display: none;">
        <h2>תוצאת חיפוש</h2>
        <div id="searchCardContainer" class="weather-grid"></div>
        <hr style="margin-top: 30px; border: 0; border-top: 1px solid #ccc;">
    </div>

    <nav>
        <button class="nav-btn active" onclick="switchPage('israel')">ערים בישראל</button>
        <button class="nav-btn" onclick="switchPage('world')">ערים מובילות בעולם</button>
    </nav>

    <div id="israel" class="page active">
        <h2>ערים מרכזיות בישראל</h2>
        <div class="weather-grid" id="israel-grid">
            </div>
    </div>

    <div id="world" class="page">
        <h2>ערים מובילות בעולם</h2>
        <div class="weather-grid" id="world-grid">
            </div>
    </div>

    <script>
        // רשימת ערים בישראל עם קואורדינטות
        const israelCities = [
            { name: "ירושלים", lat: 31.7683, lon: 35.2137 },
            { name: "תל אביב", lat: 32.0853, lon: 34.7818 },
            { name: "חיפה", lat: 32.7940, lon: 34.9896 },
            { name: "באר שבע", lat: 31.2530, lon: 34.7915 }
        ];

        // רשימת ערים בעולם עם קואורדינטות
        const worldCities = [
            { name: "לונדון", lat: 51.5074, lon: -0.1278 },
            { name: "ניו יורק", lat: 40.7128, lon: -74.0060 },
            { name: "פריז", lat: 48.8566, lon: 2.3522 },
            { name: "טוקיו", lat: 35.6762, lon: 139.6503 },
            { name: "רומא", lat: 41.9028, lon: 12.4964 }
        ];

        // פונקציה לשליפת נתוני מזג אוויר מ-API
        async function fetchWeather(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                return data.current_weather;
            } catch (error) {
                console.error("שגיאה שטעינת נתוני מזג האוויר:", error);
                return null;
            }
        }

        // יצירת כרטיסיית HTML עבור עיר
        function createCard(cityName, weather) {
            if (!weather) return `<div class="weather-card"><h3>${cityName}</h3><p>שגיאה שטעינת הנתונים</p></div>`;
            return `
                <div class="weather-card">
                    <h3>${cityName}</h3>
                    <div class="temp">${Math.round(weather.temperature)}°C</div>
                    <p>מהירות רוח: ${weather.windspeed} קמ"ש</p>
                </div>
            `;
        }

        // טעינת רשימת ערים ראשונית
        async function loadCityList(cities, elementId) {
            const container = document.getElementById(elementId);
            container.innerHTML = "<p>טוען נתונים...</p>";
            let html = "";
            for (const city of cities) {
                const weather = await fetchWeather(city.lat, city.lon);
                html += createCard(city.name, weather);
            }
            container.innerHTML = html;
        }

        // החלפת דפים (ישראל / חו"ל)
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                if (page.id !== 'searchResult') page.classList.remove('active');
            });
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');
        }

        // חיפוש עיר לפי שם (הקלדה)
        async function searchCity() {
            const query = document.getElementById('cityInput').value.trim();
            if (!query) return;

            const searchResultDiv = document.getElementById('searchResult');
            const container = document.getElementById('searchCardContainer');
            
            searchResultDiv.style.display = 'block';
            container.innerHTML = "<p>מחפש עיר...</p>";

            try {
                // איתור קואורדינטות לפי שם העיר
                const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
                const geoData = await geoResponse.json();

                if (geoData.results && geoData.results.length > 0) {
                    const city = geoData.results[0];
                    const weather = await fetchWeather(city.latitude, city.longitude);
                    container.innerHTML = createCard(`${city.name}, ${city.country || ''}`, weather);
                } else {
                    container.innerHTML = "<p>העיר לא נמצאה. נא לנסות באנגלית.</p>";
                }
            } catch (error) {
                container.innerHTML = "<p> אירעה שגיאה בחיפוש.</p>";
            }
        }

        // טעינה ראשונית בעת עליית הדף
        window.onload = () => {
            loadCityList(israelCities, 'israel-grid');
            loadCityList(worldCities, 'world-grid');
        };
    </script>
</body>
</html>
